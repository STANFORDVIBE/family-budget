# Проверки на каждый push и pull request: TypeScript, ESLint, Vitest, Clippy, cargo test (npm run check)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Rust-часть встраивает собранный интерфейс из dist — без него не соберётся
      - run: npm run build
      - run: npm run check
